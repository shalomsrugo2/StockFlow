[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F7F8F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B0D12"
# Streamlit >= 1.46 honours named fonts + fontFaces; older versions fall back to
# the Google Fonts stylesheet injected in theme.py.
font = "Instrument Sans"
codeFont = "JetBrains Mono"
headingFont = "Space Grotesk"
baseRadius = "medium"
borderColor = "#E8EAEE"

[[theme.fontFaces]]
family = "Instrument Sans"
url = "https://fonts.gstatic.com/s/instrumentsans/v1/pximypc9vsFDm051Uf6KVwgkfoSxQ0GsQv8ToedPibnr-yp2JGEJOH9npST3-A.woff2"
weight = "400 700"

[[theme.fontFaces]]
family = "Space Grotesk"
url = "https://fonts.gstatic.com/s/spacegrotesk/v16/V8mDoQDjQSkFtoMM3T6r8E7mPbF4Cw.woff2"
weight = "400 700"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "https://fonts.gstatic.com/s/jetbrainsmono/v18/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKxjPVmUsaaDhw.woff2"
weight = "400 600"

[client]
toolbarMode = "minimal"

[server]
runOnSave = true
